name: Release

# 推送 v 开头的 tag（如 v1.0.0-beta、v1.1.0）即自动构建并发布 Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Rename exe with tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "bin/Release/net8.0-windows/win-x64/publish/dnf-autofire.exe" "dnf-autofire-$tag.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dnf-autofire-*.exe
          generate_release_notes: true
