name: Release

# 推送 v 开头的 tag（如 v1.0.0-beta、v1.1.0）即自动构建并发布 Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests
        run: dotnet test tests/DnfAutoFire.Tests/DnfAutoFire.Tests.csproj -c Release

      # exe 内嵌的程序集版本取自 csproj。打 tag 时用 tag 版本（去掉 v 前缀）覆盖，
      # 保证 v1.3.0 的 tag 出来的 exe 自报 1.3.0，不会停留在 csproj 里的旧版本。
      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish -c Release -r win-x64 -p:Version=$version -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      # 附件统一叫 dnf-autofire.exe：版本信息由 Release 页面与 tag 承载，不在文件名重复
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows/win-x64/publish/dnf-autofire.exe
          generate_release_notes: true
